<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interplanetary Survival Guide</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Interplanetary Survival Guide</h1>
      <p id="status" role="status">Loading map and mission data…</p>
      
      <div id="controls">
        <button id="download-mission" type="button" disabled>
          Download mission results
        </button>
        <button id="download-path" type="button" disabled>
          Download path coordinates
        </button>
        <p id="metrics"></p>
      </div>
      <div id="sketch-container"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script type="module" src="./mapWindow.js"></script>
  </body>
</html>
